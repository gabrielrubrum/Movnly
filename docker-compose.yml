services:
  nexrice-db:
    image: postgres:15-alpine
    container_name: nexrice-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-nexrice}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nexrice-network

  nexrice-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexrice-backend
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@nexrice-db:5432/${POSTGRES_DB:-nexrice}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      FRONTEND_URL: https://${DOMAIN}
      BACKEND_URL: https://api.${DOMAIN}
      RESEND_API_KEY: ${RESEND_API_KEY}
      MAIL_FROM: ${MAIL_FROM}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    depends_on:
      - nexrice-db
    networks:
      - nexrice-network

  nexrice-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
        NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY}
        NEXT_PUBLIC_SOCKET_URL: https://api.${DOMAIN}
    container_name: nexrice-frontend
    restart: always
    environment:
      NODE_ENV: production
    networks:
      - nexrice-network

  nexrice-nginx:
    image: nginx:latest
    container_name: nexrice-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/certbot/conf:/etc/letsencrypt
      - ./infra/certbot/www:/var/www/certbot
    depends_on:
      - nexrice-backend
      - nexrice-frontend
    networks:
      - nexrice-network

networks:
  nexrice-network:
    driver: bridge

volumes:
  postgres_data:
